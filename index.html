<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti... 💕</title>
    
    <!-- Fuentes premium -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Paleta de colores premium */
            --bg-dark: #0a0a16;
            --bg-glow: rgba(255, 77, 109, 0.15);
            --envelope-main: #ff4d6d;
            --envelope-dark: #c9184a;
            --envelope-shadow: rgba(0, 0, 0, 0.6);
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
            --text-light: #f8f9fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            background: var(--bg-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            perspective: 1200px;
        }

        /* Fondo Dinámico Espacial */
        .stars-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a1a3a 0%, #0a0a16 100%);
            z-index: -2;
        }

        .glow-overlay {
            position: fixed;
            top: 50%; left: 50%;
            width: 150vw; height: 150vh;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle at center, var(--bg-glow) 0%, transparent 60%);
            z-index: -1;
            animation: pulse-glow 6s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
        }

        /* Contenedor Principal del Sobre */
        .envelope-wrapper {
            position: relative;
            /* Tamaños base para desktop */
            width: 380px;
            height: 250px;
            z-index: 10;
            transition: transform 0.2s ease-out;
            transform-style: preserve-3d;
        }

        .envelope {
            position: relative;
            width: 100%;
            height: 100%;
            background: var(--envelope-dark);
            border-radius: 8px 8px 12px 12px;
            cursor: pointer;
            box-shadow: 0 25px 50px var(--envelope-shadow);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .envelope:hover {
            transform: translateY(-8px) scale(1.03);
        }

        /* Capas del sobre */
        .back-side {
            position: absolute;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--envelope-dark), #800f2f);
            border-radius: 8px 8px 12px 12px;
            z-index: 1;
        }

        .front-side {
            position: absolute;
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, var(--envelope-main), var(--envelope-dark));
            clip-path: polygon(0 40%, 50% 100%, 100% 40%, 100% 100%, 0 100%);
            border-radius: 0 0 12px 12px;
            z-index: 4;
            box-shadow: inset 0 20px 30px rgba(0,0,0,0.15);
        }

        .lid {
            position: absolute;
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, #ff758f, var(--envelope-main));
            clip-path: polygon(0 0, 100% 0, 50% 55%);
            border-radius: 12px 12px 0 0;
            z-index: 5;
            transform-origin: top;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), z-index 0s 0.3s;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
        }

        /* La Carta (Glassmorphism) */
        .letter-glass {
            position: absolute;
            width: 90%;
            height: 90%;
            left: 5%;
            top: 5%;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 30px 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            z-index: 3;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease;
            opacity: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .letter-title {
            font-family: 'Dancing Script', cursive;
            color: var(--text-light);
            font-size: 2.2rem;
            margin: 0 0 15px 0;
            text-align: center;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.5s ease 0.8s, transform 0.5s ease 0.8s;
        }

        .letter-text {
            color: var(--text-light);
            font-size: 1rem;
            line-height: 1.6;
            font-weight: 400;
            text-align: center;
            min-height: 120px; /* Previene saltos de tamaño mientras se escribe */
            text-shadow: 0 1px 3px rgba(0,0,0,0.4);
        }

        .cursor {
            display: inline-block;
            width: 2px;
            background-color: white;
            animation: blink 0.8s infinite;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Estado Abierto */
        .open .lid {
            transform: rotateX(180deg);
            z-index: 1; /* Pasa atrás */
        }

        .open .letter-glass {
            transform: translateY(-160px) scale(1.1);
            opacity: 1;
            z-index: 10; /* Pasa al frente */
            pointer-events: auto;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
        }

        .open .letter-title {
            opacity: 1;
            transform: translateY(0);
        }

        .open:hover {
            transform: translateY(0) scale(1); /* Desactiva el hover del sobre al abrir */
            cursor: default;
        }

        /* Partículas Premium */
        .particle {
            position: absolute;
            pointer-events: none;
            z-index: 100;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.6));
            will-change: transform, opacity;
        }

        @keyframes rise {
            0% { transform: translateY(0) rotate(0deg) scale(0); opacity: 0; }
            15% { opacity: 1; transform: scale(1.2); }
            100% { transform: translateY(-80vh) rotate(360deg) scale(0.6); opacity: 0; }
        }

        /* Indicador de click */
        .click-indicator {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: pulse-text 2s infinite;
            pointer-events: none;
        }

        @keyframes pulse-text {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        .open ~ .click-indicator {
            display: none;
        }

        /* Media Queries para Responsividad (Celulares) */
        @media (max-width: 768px) {
            .envelope-wrapper {
                width: 300px;
                height: 200px;
            }
            .letter-glass {
                padding: 20px 15px;
            }
            .letter-title {
                font-size: 1.8rem;
                margin-bottom: 10px;
            }
            .letter-text {
                font-size: 0.9rem;
            }
            /* Menos desplazamiento en Y para que no se salga de la pantalla en vertical */
            .open .letter-glass {
                transform: translateY(-130px) scale(1.05); 
            }
        }
    </style>
</head>
<body>

    <div class="stars-container"></div>
    <div class="glow-overlay"></div>

    <div class="envelope-wrapper">
        <div class="envelope" onclick="toggleEnvelope()">
            <div class="lid"></div> 
            <div class="back-side"></div> 
            
            <div class="letter-glass" id="letter">
                <h2 class="letter-title">Para ti... 💕</h2>
                <div class="letter-text">
                    <span id="mensaje"></span><span class="cursor" id="cursor"></span>
                </div>
            </div>
            
            <div class="front-side"></div> 
        </div>
        <div class="click-indicator">Toca para abrir</div>
    </div>

    <script>
        let isOpened = false;
        let isTyping = false;

        function toggleEnvelope() {
            if (isOpened) return; // Si ya está abierto, no hacer nada
            
            const envelope = document.querySelector('.envelope');
            envelope.classList.add('open');
            isOpened = true;
            
            // Ocultar el cursor si no está escribiendo
            setTimeout(() => {
                escribirMensaje();
            }, 1200); // Esperar a que la carta suba por completo
        }

        function escribirMensaje() {
            if (isTyping) return;
            isTyping = true;

            const texto = "Hola... Solo quería tomarme un momento para decirte lo mucho que me encantas. Me haces sonreír bastante y la verdad, ya tengo muchas ganas de verte. Espero que este pequeño detalle te alegre el día. ❤️";
            const elemento = document.getElementById("mensaje");
            const cursor = document.getElementById("cursor");
            
            let i = 0;
            function typeWriter() {
                if (i < texto.length) {
                    elemento.innerHTML += texto.charAt(i);
                    i++;
                    // Velocidad aleatoria para simular escritura humana real
                    let randomSpeed = Math.floor(Math.random() * (60 - 30 + 1)) + 30; 
                    setTimeout(typeWriter, randomSpeed);
                } else {
                    cursor.style.display = 'none'; // Ocultar cursor al terminar
                    createMagic(); // Iniciar lluvia de partículas
                }
            }
            typeWriter();
        }

        function createMagic() {
            const simbolos = ["❤️", "✨", "💫", "💕", "🌸"];
            
            // Generar partículas continuamente pero sin sobrecargar la memoria
            const particleInterval = setInterval(() => {
                // Generar de 1 a 2 partículas a la vez
                for(let i=0; i < 2; i++){
                    const randomSymbol = simbolos[Math.floor(Math.random() * simbolos.length)];
                    createParticle(randomSymbol);
                }
            }, 500);

            // Detener la creación masiva después de 15 segundos para no agotar la batería del usuario
            setTimeout(() => {
                clearInterval(particleInterval);
            }, 15000);
        }

        function createParticle(symbol) {
            const p = document.createElement("div");
            p.className = "particle";
            p.innerHTML = symbol;
            
            // Posición aleatoria a lo ancho de la pantalla
            p.style.left = Math.random() * 100 + "vw";
            p.style.bottom = "-5vh"; // Iniciar ligeramente debajo de la vista
            
            // Tamaño aleatorio para dar profundidad
            p.style.fontSize = (Math.random() * 15 + 15) + "px";
            
            // Duración de animación aleatoria
            const duration = Math.random() * 4 + 4;
            p.style.animation = `rise ${duration}s ease-out forwards`;
            
            document.body.appendChild(p);
            
            // Limpiar el DOM eliminando el elemento cuando termina su animación
            setTimeout(() => p.remove(), duration * 1000);
        }

        // Efecto Parallax Suave (Solo si el dispositivo soporta hover / Mouse)
        const isHoverSupported = window.matchMedia('(hover: hover)').matches;
        
        if (isHoverSupported) {
            document.addEventListener("mousemove", (e) => {
                if (!isOpened) { 
                    const xAxis = (window.innerWidth / 2 - e.pageX) / 40;
                    const yAxis = (window.innerHeight / 2 - e.pageY) / 40;
                    document.querySelector('.envelope-wrapper').style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
                } else {
                    // Resetear posición al abrir para lectura cómoda
                    document.querySelector('.envelope-wrapper').style.transform = `rotateY(0deg) rotateX(0deg)`;
                }
            });
        }
    </script>
</body>
</html>
