<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Un detalle especial para ti ✨</title>
    
    <!-- Google Fonts Premium -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Dancing+Script:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           1. VARIABLES & TEMAS DINÁMICOS
           ========================================================================== */
        :root {
            --bg-deep: #06050c;
            --bg-mid: #160a1c;
            --bg-glow: #2c0c30;
            
            --primary: #ff2a6d;
            --primary-soft: #ff8fa3;
            --primary-dark: #800f2f;
            --secondary: #7b2cbf;
            
            --gold-light: #fff3b0;
            --gold-mid: #ffd166;
            --gold-dark: #b5830d;
            
            --env-body: #a4133c;
            --env-flap: #c9184a;
            --env-pocket: #800f2f;
            --env-inside: #590d22;
            
            --glass-bg: rgba(22, 10, 28, 0.78);
            --glass-border: rgba(255, 182, 193, 0.28);
            --glass-highlight: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.72);
            
            --shadow-soft: 0 25px 65px rgba(0, 0, 0, 0.75);
            --shadow-glow: 0 0 45px rgba(255, 42, 109, 0.25);
        }

        /* Tema: Galaxia Violeta */
        [data-theme="galaxy"] {
            --bg-deep: #050510;
            --bg-mid: #0f0c29;
            --bg-glow: #24243e;
            --primary: #9d4edd;
            --primary-soft: #e0aaff;
            --primary-dark: #3c096c;
            --secondary: #4ea8de;
            --env-body: #5a189a;
            --env-flap: #7b2cbf;
            --env-pocket: #3c096c;
            --env-inside: #240046;
            --glass-bg: rgba(15, 12, 41, 0.78);
            --glass-border: rgba(224, 170, 255, 0.28);
            --shadow-glow: 0 0 45px rgba(157, 78, 221, 0.28);
        }

        /* Tema: Atardecer Dorado */
        [data-theme="gold"] {
            --bg-deep: #0b0704;
            --bg-mid: #1f1108;
            --bg-glow: #3b1d0b;
            --primary: #f77f00;
            --primary-soft: #fcbf49;
            --primary-dark: #7f4f24;
            --secondary: #d62828;
            --env-body: #99582a;
            --env-flap: #bb9457;
            --env-pocket: #6f1d1b;
            --env-inside: #432818;
            --glass-bg: rgba(28, 16, 10, 0.80);
            --glass-border: rgba(252, 191, 73, 0.32);
            --shadow-glow: 0 0 45px rgba(252, 191, 73, 0.25);
        }

        /* Tema: Océano Esmeralda */
        [data-theme="ocean"] {
            --bg-deep: #03090c;
            --bg-mid: #081c24;
            --bg-glow: #0b3948;
            --primary: #00b4d8;
            --primary-soft: #90e0ef;
            --primary-dark: #03045e;
            --secondary: #48cae4;
            --env-body: #0077b6;
            --env-flap: #0096c7;
            --env-pocket: #023e8a;
            --env-inside: #03045e;
            --glass-bg: rgba(8, 28, 36, 0.80);
            --glass-border: rgba(144, 224, 239, 0.28);
            --shadow-glow: 0 0 45px rgba(0, 180, 216, 0.25);
        }

        /* ==========================================================================
           2. RESET & BASE LAYOUT
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-deep);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
            perspective: 1400px;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: radial-gradient(circle at 50% 35%, var(--bg-glow) 0%, var(--bg-mid) 45%, var(--bg-deep) 100%);
            transition: background 0.8s ease;
        }

        /* ==========================================================================
           3. CAPAS DE FONDO (CANVAS, AURORAS Y NEBULOSA)
           ========================================================================== */
        #bgCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        #trailCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 95;
            pointer-events: none;
        }

        .nebula-layer {
            position: fixed;
            inset: -20%;
            width: 140%;
            height: 140%;
            z-index: 0;
            pointer-events: none;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 42, 109, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(123, 44, 191, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 209, 102, 0.05) 0%, transparent 60%);
            filter: blur(45px);
            animation: nebulaDrift 22s ease-in-out infinite alternate;
        }

        @keyframes nebulaDrift {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(4deg) scale(1.06); }
            100% { transform: rotate(-4deg) scale(0.98); }
        }

        .vignette-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            background: radial-gradient(circle at center, transparent 55%, rgba(0, 0, 0, 0.65) 100%);
        }

        /* ==========================================================================
           4. BARRA SUPERIOR (CONTROLES & TEMAS)
           ========================================================================== */
        .top-Controls {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 560px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            gap: 8px;
        }

        .left-controls, .right-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 999px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--primary-soft);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35), 0 0 15px rgba(255, 143, 163, 0.25);
        }

        .glass-btn:active {
            transform: translateY(0) scale(0.97);
        }

        .theme-dots {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            padding: 6px 10px;
            border-radius: 999px;
        }

        .theme-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.35);
            transition: transform 0.25s ease, border-color 0.25s ease;
        }

        .theme-dot:hover {
            transform: scale(1.2);
        }

        .theme-dot.active {
            border-color: #fff;
            transform: scale(1.18);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }

        .dot-rose { background: linear-gradient(135deg, #ff2a6d, #800f2f); }
        .dot-galaxy { background: linear-gradient(135deg, #9d4edd, #3c096c); }
        .dot-gold { background: linear-gradient(135deg, #fcbf49, #99582a); }
        .dot-ocean { background: linear-gradient(135deg, #00b4d8, #023e8a); }

        /* Ecualizador animado del botón de música */
        .eq-bars {
            display: inline-flex;
            align-items: flex-end;
            gap: 2px;
            height: 12px;
            width: 14px;
        }

        .eq-bar {
            width: 3px;
            background: var(--gold-mid);
            border-radius: 2px;
            height: 3px;
            transition: height 0.2s ease;
        }

        .playing .eq-bar:nth-child(1) { animation: eqBounce 0.6s infinite ease-in-out alternate; }
        .playing .eq-bar:nth-child(2) { animation: eqBounce 0.45s infinite ease-in-out alternate 0.15s; }
        .playing .eq-bar:nth-child(3) { animation: eqBounce 0.7s infinite ease-in-out alternate 0.3s; }

        @keyframes eqBounce {
            0% { height: 3px; }
            100% { height: 12px; }
        }

        /* ==========================================================================
           5. ESCENA CENTRAL & SOBRE 3D REALISTA
           ========================================================================== */
        .stage {
            position: relative;
            width: 92%;
            max-width: 470px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        .envelope-scene {
            position: relative;
            width: 340px;
            height: 235px;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: opacity 0.65s ease, transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: floatIdle 4s ease-in-out infinite;
        }

        @keyframes floatIdle {
            0%, 100% { transform: translateY(0px) rotateZ(0deg); }
            50% { transform: translateY(-10px) rotateZ(0.5deg); }
        }

        .envelope-scene.opening {
            animation: none;
        }

        .envelope-scene.hidden {
            opacity: 0;
            transform: translateY(70px) scale(0.75) rotateX(20deg);
            pointer-events: none;
            position: absolute;
        }

        /* Sombra proyectada en el piso */
        .envelope-shadow {
            position: absolute;
            bottom: -32px;
            left: 10%;
            width: 80%;
            height: 24px;
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.65) 0%, transparent 75%);
            filter: blur(8px);
            z-index: 0;
            transition: transform 0.5s ease, opacity 0.5s ease;
        }

        /* Resplandor detrás del sobre */
        .envelope-aura {
            position: absolute;
            inset: -20px;
            background: radial-gradient(circle at center, var(--primary) 0%, transparent 70%);
            opacity: 0.28;
            filter: blur(25px);
            z-index: 0;
            transition: opacity 0.4s ease;
        }

        .envelope-scene:hover .envelope-aura {
            opacity: 0.48;
        }

        /* Cuerpo trasero del sobre */
        .env-back {
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, var(--env-body), var(--env-inside));
            border-radius: 16px;
            box-shadow: var(--shadow-soft), inset 0 0 25px rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.12);
            z-index: 1;
            overflow: hidden;
        }

        /* Forro interior elegante con patrón sutil */
        .env-back::after {
            content: '';
            position: absolute;
            inset: 6px;
            border-radius: 12px;
            border: 1px dashed rgba(255, 209, 102, 0.22);
            pointer-events: none;
        }

        /* Hoja asomándose dentro del sobre antes de abrir */
        .env-paper-preview {
            position: absolute;
            width: 88%;
            height: 82%;
            left: 6%;
            top: 8%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(255, 235, 240, 0.85));
            border-radius: 10px;
            z-index: 2;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 16px;
        }

        .env-paper-preview span {
            font-family: 'Dancing Script', cursive;
            color: var(--env-pocket);
            font-size: 1.25rem;
            opacity: 0.75;
        }

        .envelope-scene.opening .env-paper-preview {
            transform: translateY(-75px) scale(1.03);
        }

        /* Solapas laterales */
        .env-side-left {
            position: absolute;
            inset: 0;
            background: linear-gradient(125deg, var(--env-body) 0%, var(--env-pocket) 100%);
            clip-path: polygon(0 0, 52% 52%, 0 100%);
            border-radius: 16px 0 0 16px;
            z-index: 3;
        }

        .env-side-right {
            position: absolute;
            inset: 0;
            background: linear-gradient(235deg, var(--env-body) 0%, var(--env-pocket) 100%);
            clip-path: polygon(100% 0, 48% 52%, 100% 100%);
            border-radius: 0 16px 16px 0;
            z-index: 3;
        }

        /* Bolsillo frontal inferior */
        .env-pocket {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, var(--env-flap) 0%, var(--env-pocket) 100%);
            clip-path: polygon(0 100%, 50% 44%, 100% 100%);
            border-radius: 0 0 16px 16px;
            z-index: 4;
            box-shadow: 0 -8px 25px rgba(0, 0, 0, 0.35);
        }

        /* Borde dorado en el bolsillo frontal */
        .env-pocket::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 209, 102, 0.45), transparent);
            clip-path: polygon(0 100%, 50% 44%, 50% 46%, 0 100%);
        }

        /* Solapa superior móvil (Lid) */
        .env-flap {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, var(--env-flap) 0%, var(--env-body) 100%);
            clip-path: polygon(0 0, 100% 0, 50% 58%);
            border-radius: 16px 16px 0 0;
            z-index: 5;
            transform-origin: top center;
            transition: transform 0.65s cubic-bezier(0.4, 0, 0.2, 1), z-index 0.2s 0.3s;
            filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.4));
        }

        .envelope-scene.opening .env-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        /* ==========================================================================
           6. SELLO DE LACRE 3D CON RELIEVE DORADO
           ========================================================================== */
        .wax-seal-wrapper {
            position: absolute;
            top: 54%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 6;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.4s ease, opacity 0.4s ease;
        }

        .envelope-scene.opening .wax-seal-wrapper {
            transform: translate(-50%, -50%) scale(1.4);
            opacity: 0;
        }

        .wax-seal {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            background: radial-gradient(circle at 32% 28%, var(--gold-light) 0%, var(--gold-mid) 38%, var(--gold-dark) 82%, #5c3d04 100%);
            box-shadow: 
                0 8px 20px rgba(0, 0, 0, 0.65),
                inset 0 3px 6px rgba(255, 255, 255, 0.7),
                inset 0 -4px 8px rgba(0, 0, 0, 0.55),
                0 0 0 4px rgba(255, 209, 102, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            animation: sealPulse 2.2s infinite ease-in-out;
        }

        .wax-seal::before {
            content: '';
            position: absolute;
            inset: 6px;
            border-radius: 50%;
            border: 1.5px dashed rgba(92, 61, 4, 0.55);
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.35);
        }

        .wax-seal-icon {
            font-size: 1.65rem;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.4));
            transform: translateY(1px);
        }

        @keyframes sealPulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.65), 0 0 0 0 rgba(255, 209, 102, 0.55);
            }
            50% {
                transform: scale(1.07);
                box-shadow: 0 12px 28px rgba(0, 0, 0, 0.75), 0 0 0 14px rgba(255, 209, 102, 0);
            }
        }

        .seal-prompt {
            position: absolute;
            bottom: -48px;
            width: 260px;
            text-align: center;
            font-size: 0.86rem;
            font-weight: 500;
            color: var(--primary-soft);
            letter-spacing: 0.6px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            animation: promptFade 2.4s ease-in-out infinite;
        }

        @keyframes promptFade {
            0%, 100% { opacity: 0.45; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-3px); }
        }

        /* ==========================================================================
           7. TARJETA DE LA CARTA DESPLEGADA (GLASSMORPHISM DE LUJO)
           ========================================================================== */
        .letter-modal {
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(26px);
            -webkit-backdrop-filter: blur(26px);
            border: 1px solid var(--glass-border);
            border-radius: 26px;
            padding: 32px 26px 26px;
            box-shadow: var(--shadow-soft), var(--shadow-glow), inset 0 1px 1px rgba(255, 255, 255, 0.25);
            position: relative;
            display: none;
            flex-direction: column;
            gap: 18px;
            opacity: 0;
            transform: translateY(35px) scale(0.92);
            transition: opacity 0.65s ease, transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-height: 82dvh;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .letter-modal.active {
            display: flex;
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Scrollbar estilizado */
        .letter-modal::-webkit-scrollbar {
            width: 5px;
        }
        .letter-modal::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        /* Ornamentos SVG en las 4 esquinas */
        .corner-ornament {
            position: absolute;
            width: 34px;
            height: 34px;
            pointer-events: none;
            opacity: 0.55;
            color: var(--gold-mid);
        }
        .corner-tl { top: 10px; left: 10px; }
        .corner-tr { top: 10px; right: 10px; transform: scaleX(-1); }
        .corner-bl { bottom: 10px; left: 10px; transform: scaleY(-1); }
        .corner-br { bottom: 10px; right: 10px; transform: scale(-1, -1); }

        /* Cabecera de la Carta */
        .letter-header {
            text-align: center;
            position: relative;
            padding-bottom: 14px;
        }

        .letter-badge {
            display: inline-block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: var(--gold-mid);
            background: rgba(255, 209, 102, 0.1);
            border: 1px solid rgba(255, 209, 102, 0.28);
            padding: 4px 12px;
            border-radius: 99px;
            margin-bottom: 8px;
        }

        .letter-title {
            font-family: 'Dancing Script', cursive;
            font-size: 2.45rem;
            line-height: 1.15;
            background: linear-gradient(90deg, #ffffff 0%, var(--primary-soft) 50%, var(--gold-mid) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 10px rgba(255, 42, 109, 0.2));
        }

        .header-divider {
            width: 75%;
            height: 1px;
            margin: 12px auto 0;
            background: linear-gradient(90deg, transparent, var(--glass-border), var(--gold-mid), var(--glass-border), transparent);
            position: relative;
        }

        .header-divider::after {
            content: '✦';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-mid);
            padding: 0 8px;
            color: var(--gold-mid);
            font-size: 0.75rem;
        }

        /* Cuerpo del Mensaje */
        .letter-content {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.38rem;
            line-height: 1.68;
            color: rgba(255, 255, 255, 0.96);
            text-align: center;
            padding: 4px 8px;
            min-height: 105px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .typewriter-wrapper {
            display: inline;
        }

        .type-cursor {
            display: inline-block;
            width: 2px;
            height: 1.15em;
            background: var(--primary);
            vertical-align: text-bottom;
            margin-left: 3px;
            box-shadow: 0 0 8px var(--primary);
            animation: cursorBlink 0.75s infinite;
        }

        @keyframes cursorBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ==========================================================================
           8. FILA ÚNICA DE ACCIONES: P.D. SECRETA + REPETIR ALINEADOS
           ========================================================================== */
        .letter-actions-row {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
            margin-top: 6px;
            opacity: 0;
            transform: translateY(12px);
            pointer-events: none;
            transition: opacity 0.55s ease, transform 0.55s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .letter-actions-row.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* Botón de Posdata Secreta (Ocupa el espacio principal de la fila) */
        .pd-secret-btn {
            flex: 1;
            min-height: 46px;
            background: linear-gradient(135deg, rgba(255, 209, 102, 0.16) 0%, rgba(255, 42, 109, 0.16) 100%);
            border: 1px dashed rgba(255, 209, 102, 0.65);
            border-radius: 14px;
            padding: 10px 14px;
            color: var(--gold-mid);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            text-align: center;
            line-height: 1.3;
            transition: all 0.35s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* Efecto de brillo deslizante en el botón de P.D. */
        .pd-secret-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.22), transparent);
            transform: skewX(-20deg);
            animation: shimmerSlide 3.2s infinite;
        }

        @keyframes shimmerSlide {
            0% { left: -100%; }
            45%, 100% { left: 160%; }
        }

        .pd-secret-btn:hover {
            background: linear-gradient(135deg, rgba(255, 209, 102, 0.25) 0%, rgba(255, 42, 109, 0.25) 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(255, 209, 102, 0.2);
        }

        .pd-secret-btn.unlocked {
            background: rgba(255, 255, 255, 0.1);

            color: #ffffff;
            font-weight: 500;
            box-shadow: 0 0 20px rgba(255, 143, 163, 0.25);
        }

        .pd-secret-btn.unlocked::before {
            display: none;
        }

        /* Botón Repetir (Alineado a la derecha en la misma fila) */
        .replay-action-btn {
            min-height: 46px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 14px;
            padding: 10px 16px;
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .replay-action-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: #ffffff;
            transform: translateY(-2px);
        }

        .replay-action-btn:active {
            transform: translateY(0) scale(0.96);
        }

        /* ==========================================================================
           9. MODAL PERSONALIZADOR (CREADOR DE LINKS)
           ========================================================================== */
        .customizer-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(4, 3, 9, 0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 18px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .customizer-backdrop.open {
            display: flex;
            opacity: 1;
        }

        .customizer-card {
            width: 100%;
            max-width: 430px;
            background: #140b1c;
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 26px 22px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            gap: 15px;
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        .customizer-backdrop.open .customizer-card {
            transform: scale(1);
        }

        .customizer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .customizer-header h3 {
            font-size: 1.15rem;
            color: var(--primary-soft);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .close-modal-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.3rem;
            cursor: pointer;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .form-input, .form-textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            padding: 11px 14px;
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;

            border-color: var(--primary-soft);

            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            color: #fff;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.86rem;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 42, 109, 0.35);
            transition: transform 0.2s ease;
        }

        .btn-save:hover {
            transform: translateY(-2px);
        }

        /* Toast de notificación */
        .toast-notification {
            position: fixed;
            bottom: 55px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            background: rgba(20, 180, 110, 0.92);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 10px 20px;
            border-radius: 99px;
            font-size: 0.84rem;
            font-weight: 600;

            pointer-events: none;
            transition: all 0.35s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .toast-notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ==========================================================================
           10. PARTÍCULAS EMOJI & CRÉDITOS DE PIE DE PÁGINA
           ========================================================================== */
        .floating-emoji {
            position: fixed;
            pointer-events: none;
            z-index: 90;
            will-change: transform, opacity;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.35));
            animation: emojiRise linear forwards;
        }

        @keyframes emojiRise {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg) scale(0.3);
                opacity: 0;
            }
            15% {
                opacity: 1;
                transform: translateY(-12vh) translateX(10px) rotate(20deg) scale(1);
            }
            50% {
                transform: translateY(-50vh) translateX(-15px) rotate(180deg) scale(1.05);
            }
            100% {

        .creditos-footer {
            position: fixed;

        .pulse-heart {

        /* ==========================================================================

                font-size: 0.78rem;
                padding: 9px 12px;
            }
        }
    </style>
</head>
<body data-theme="rose">

    <!-- Capas Atmosféricas -->
    <div class="nebula-layer"></div>
    <canvas id="bgCanvas"></canvas>

    <!-- Barra Superior -->

            <div class="theme-dots" title="Cambiar ambiente">
                <div class="theme-dot dot-rose active" onclick="setTheme('rose', this)"></div>
                <div class="theme-dot dot-galaxy" onclick="setTheme('galaxy', this)"></div>
                <div class="theme-dot dot-gold" onclick="setTheme('gold', this)"></div>

                <div class="eq-bars" id="eqBars">

    <!-- Escenario Principal -->
    <main class="stage">
        
        <!-- SOBRE 3D INTERACTIVO -->
        <div class="envelope-scene" id="envelopeScene" onclick="handleEnvelopeClick()">
            <div class="envelope-aura"></div>
            <div class="envelope-shadow"></div>
            
            <div class="env-back"></div>
            <div class="env-paper-preview">
                <span>Para ti...</span>
            </div>
            <div class="env-side-left"></div>
            <div class="env-side-right"></div>
            <div class="env-pocket"></div>
            <div class="env-flap"></div>

            <!-- Sello de Lacre Dorado -->
            <div class="wax-seal-wrapper">

                    <span class="wax-seal-icon">💖</span>

            </div>

            <div class="seal-prompt">✨ Toca para abrir ✨</div>
        </div>

        <!-- CARTA DESPLEGADA -->
        <article class="letter-modal" id="letterModal">
            <!-- Ornamentos SVG en las esquinas -->
            <svg class="corner-ornament corner-tl" viewBox="0 0 40 40" fill="none">
                <path d="M2 38V14C2 7.37258 7.37258 2 14 2H38" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <circle cx="14" cy="14" r="3" fill="currentColor"/>
            </svg>
            <svg class="corner-ornament corner-tr" viewBox="0 0 40 40" fill="none">
                <path d="M2 38V14C2 7.37258 7.37258 2 14 2H38" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <circle cx="14" cy="14" r="3" fill="currentColor"/>
            </svg>
            <svg class="corner-ornament corner-bl" viewBox="0 0 40 40" fill="none">
                <path d="M2 38V14C2 7.37258 7.37258 2 14 2H38" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <circle cx="14" cy="14" r="3" fill="currentColor"/>
            </svg>
            <svg class="corner-ornament corner-br" viewBox="0 0 40 40" fill="none">
                <path d="M2 38V14C2 7.37258 7.37258 2 14 2H38" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>

            <div class="letter-header">

    </main>

    <!-- MODAL PERSONALIZADOR -->
    <div class="customizer-backdrop" id="customizerModal">
        <div class="customizer-card">
            <div class="customizer-header">
                <h3> Personalizar</h3>
                <button class="close-modal-btn" onclick="closeCustomizer()">✕</button>
            </div>

            <div class="form-group">
                <label for="customTitleInput">Título de la carta</label>
                <input type="text" id="customTitleInput" class="form-input" maxlength="45" placeholder="Ej. Para alguien muy especial ✨">
            </div>

            <div class="form-group">
                <label for="customMsgInput">Mensaje principal</label>
                <textarea id="customMsgInput" class="form-textarea" rows="4" maxlength="420" placeholder="Escribe aquí lo que quieres dedicar..."></textarea>
            </div>

            <div class="form-group">
                <label for="customPdInput">Posdata Secreta (Sorpresa al tocar)</label>
                <input type="text" id="customPdInput" class="form-input" maxlength="90" placeholder="Ej. ✨ Vale por una salida juntos a donde tú elijas ✨">
            </div>

            <div class="modal-footer">
                <button class="glass-btn" onclick="closeCustomizer()">Cancelar</button>
                <button class="btn-save" onclick="copyShareableUrl()">Copiar Enlace 🔗</button>
            </div>
        </div>
    </div>

    <!-- Notificación Toast -->
    <div class="toast-notification" id="toastMsg">¡Enlace copiado al portapapeles! ✨</div>

    <!-- Pie de página -->
    <footer class="creditos-footer">
        Hecho con <span class="pulse-heart">❤️</span> por <strong>Said Ojeda</strong>
    </footer>

    <!-- ==========================================================================
         LÓGICA JAVASCRIPT (AUDIO PROCEDIMENTAL, CANVAS, PARALLAX, URL PARAMS)
         ========================================================================== -->
    <script>
        /* --------------------------------------------------------------------------
           1. LECTURA DE PARÁMETROS URL Y ESTADO GLOBAL
           -------------------------------------------------------------------------- */
        const urlParams = new URLSearchParams(window.location.search);

        const DEFAULT_TITLE = "Para ti ✨";
        const DEFAULT_MSG = "Hay personas que tienen la magia de hacer que cualquier momento se sienta especial sin siquiera intentarlo, y tú eres una de ellas. Quería dejarte este pequeño detalle solo para sacarte una sonrisa hoy.";
        const DEFAULT_PD = "✨ Vale por una salida juntos a donde tú elijas ✨";

        const state = {
            title: urlParams.get('title') || urlParams.get('t') || DEFAULT_TITLE,
            message: urlParams.get('msg') || urlParams.get('m') || DEFAULT_MSG,
            pd: urlParams.get('pd') || urlParams.get('p') || DEFAULT_PD,
            theme: urlParams.get('theme') || 'rose',
            isOpened: false,
            isTyping: false,
            pdUnlocked: false,
            typingTimer: null,
            musicPlaying: false,
            audioCtx: null,
            musicScheduler: null,
            noteIndex: 0
        };

        // Aplicar título y tema inicial
        document.getElementById('displayTitle').textContent = state.title;
        if (['rose', 'galaxy', 'gold', 'ocean'].includes(state.theme)) {
            document.body.setAttribute('data-theme', state.theme);
            document.querySelectorAll('.theme-dot').forEach(dot => {
                dot.classList.toggle('active', dot.classList.contains(`dot-${state.theme}`));
            });
        }

        function setTheme(themeName, dotEl) {
            state.theme = themeName;
            document.body.setAttribute('data-theme', themeName);
            document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));
            if (dotEl) dotEl.classList.add('active');
            playBellNote(783.99, 0.35, 0.04);
        }

        /* --------------------------------------------------------------------------
           2. MOTOR DE AUDIO WEB (CAJA MUSICAL ROMÁNTICA + EFECTOS DE SONIDO)
           -------------------------------------------------------------------------- */
        // Secuencia armónica de caja de música (Frecuencias en Hz)
        const MUSIC_BOX_NOTES = [
            { f: 523.25, b: 261.63 }, // C5 + C4
            { f: 659.25, b: null },   // E5
            { f: 783.99, b: 392.00 }, // G5 + G4
            { f: 1046.50, b: null },  // C6
            { f: 987.77, b: 246.94 }, // B5 + B3
            { f: 783.99, b: null },   // G5
            { f: 659.25, b: 329.63 }, // E5 + E4
            { f: 783.99, b: null },   // G5
            { f: 698.46, b: 220.00 }, // F5 + A3
            { f: 880.00, b: null },   // A5
            { f: 1046.50, b: 349.23 },// C6 + F4
            { f: 880.00, b: null },   // A5
            { f: 783.99, b: 196.00 }, // G5 + G3
            { f: 659.25, b: null },   // E5
            { f: 587.33, b: 293.66 }, // D5 + D4
            { f: 783.99, b: null }    // G5
        ];

        function ensureAudioContext() {
            if (!state.audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                state.audioCtx = new AudioContextClass();
            }
            if (state.audioCtx.state === 'suspended') {
                state.audioCtx.resume();
            }
        }

        function playBellNote(freq, duration = 1.4, volume = 0.055, type = 'sine') {
            if (!state.audioCtx) return;
            const now = state.audioCtx.currentTime;

            // Oscilador principal
            const osc = state.audioCtx.createOscillator();
            // Armónico sutil de caja musical
            const overtone = state.audioCtx.createOscillator();
            const gain = state.audioCtx.createGain();
            const overtoneGain = state.audioCtx.createGain();

            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);

            overtone.type = 'triangle';
            overtone.frequency.setValueAtTime(freq * 2, now);

            // Envolvente ADSR suave tipo celesta / music box
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.linearRampToValueAtTime(volume, now + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

            overtoneGain.gain.setValueAtTime(0.0001, now);
            overtoneGain.gain.linearRampToValueAtTime(volume * 0.25, now + 0.015);
            overtoneGain.gain.exponentialRampToValueAtTime(0.0001, now + (duration * 0.45));

            osc.connect(gain);
            overtone.connect(overtoneGain);
            gain.connect(state.audioCtx.destination);
            overtoneGain.connect(state.audioCtx.destination);

            osc.start(now);
            overtone.start(now);
            osc.stop(now + duration);
            overtone.stop(now + duration);
        }

        function startMusicAutomatically() {
            ensureAudioContext();
            if (state.musicPlaying) return;

            state.musicPlaying = true;
            updateMusicUI();

            // Tocar la primera nota de inmediato
            triggerNextMelodyStep();

            state.musicScheduler = setInterval(() => {
                if (state.musicPlaying) {
                    triggerNextMelodyStep();
                }
            }, 560);
        }

        function triggerNextMelodyStep() {
            const step = MUSIC_BOX_NOTES[state.noteIndex % MUSIC_BOX_NOTES.length];
            playBellNote(step.f, 1.5, 0.05, 'sine');
            if (step.b) {
                playBellNote(step.b, 1.8, 0.028, 'triangle');
            }
            state.noteIndex++;
        }

        function stopMusic() {
            state.musicPlaying = false;
            clearInterval(state.musicScheduler);
            updateMusicUI();
        }

        function toggleMusicManual() {
            ensureAudioContext();
            if (state.musicPlaying) {
                stopMusic();
            } else {
                startMusicAutomatically();
            }
        }

        function updateMusicUI() {
            const btn = document.getElementById('musicToggleBtn');
            const label = document.getElementById('musicLabel');
            if (state.musicPlaying) {
                btn.classList.add('playing');
                label.textContent = "Música: On";
            } else {
                btn.classList.remove('playing');
                label.textContent = "Música: Off";
            }
        }

        /* --------------------------------------------------------------------------
           3. APERTURA DEL SOBRE, MÁQUINA DE ESCRIBIR Y P.D. SECRETA
           -------------------------------------------------------------------------- */
        function handleEnvelopeClick() {
            if (state.isOpened) return;
            state.isOpened = true;

            // 1. ENCENDER LA MÚSICA AUTOMÁTICAMENTE AL ABRIR LA CARTA
            startMusicAutomatically();

            // 2. Acorde brillante de apertura
            [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, idx) => {
                setTimeout(() => playBellNote(freq, 0.9, 0.055), idx * 70);
            });

            const envScene = document.getElementById('envelopeScene');
            const letterModal = document.getElementById('letterModal');

            envScene.classList.add('opening');
            burstParticles(16);

            setTimeout(() => {
                envScene.classList.add('hidden');
                letterModal.classList.add('active');
                runTypewriter();
            }, 680);
        }

        function runTypewriter() {
            clearTimeout(state.typingTimer);
            const output = document.getElementById('typewriterOutput');
            const cursor = document.getElementById('typeCursor');
            const actionsRow = document.getElementById('actionsRow');

            output.textContent = "";
            cursor.style.display = "inline-block";
            actionsRow.classList.remove('show');
            state.isTyping = true;

            let charIndex = 0;
            const fullText = state.message;

            function typeStep() {
                if (charIndex < fullText.length) {
                    const char = fullText.charAt(charIndex);
                    output.textContent += char;

                    // Sonido sutil de cristal cada ciertas letras
                    if (charIndex % 3 === 0 && char !== ' ') {
                        playBellNote(1100 + Math.random() * 250, 0.06, 0.01);
                    }

                    charIndex++;
                    // Pausa natural en comas y puntos
                    let delay = Math.floor(Math.random() * 28) + 26;
                    if (char === ',' || char === ';') delay += 140;
                    if (char === '.' || char === '!' || char === '?') delay += 240;

                    state.typingTimer = setTimeout(typeStep, delay);
                } else {
                    state.isTyping = false;
                    cursor.style.display = "none";
                    actionsRow.classList.add('show');
                    burstParticles(18);
                }
            }

            typeStep();
        }

        function unlockSecretPd() {
            if (state.pdUnlocked) return;
            state.pdUnlocked = true;

            const btn = document.getElementById('pdSecretBtn');
            const icon = document.getElementById('pdIcon');
            const text = document.getElementById('pdText');

            btn.classList.add('unlocked');
            icon.textContent = "💝";
            text.textContent = state.pd;

            // Arpegio de desbloqueo
            [783.99, 987.77, 1174.66, 1567.98].forEach((f, i) => {
                setTimeout(() => playBellNote(f, 0.75, 0.06), i * 85);
            });

            burstParticles(22);
        }

        function replayLetter() {
            clearTimeout(state.typingTimer);
            const envScene = document.getElementById('envelopeScene');
            const letterModal = document.getElementById('letterModal');
            const actionsRow = document.getElementById('actionsRow');
            const pdBtn = document.getElementById('pdSecretBtn');

            letterModal.classList.remove('active');
            actionsRow.classList.remove('show');

            setTimeout(() => {
                envScene.classList.remove('hidden', 'opening');
                envScene.style.transform = '';
                state.isOpened = false;
                state.pdUnlocked = false;
                pdBtn.classList.remove('unlocked');
                document.getElementById('pdIcon').textContent = "🔒";
                document.getElementById('pdText').textContent = "P.D. Secreta: Toca para descubrir";
                document.getElementById('typewriterOutput').textContent = "";
            }, 350);
        }

        /* --------------------------------------------------------------------------
           4. SISTEMA DE PARTÍCULAS EMOJI Y PARALLAX 3D DEL SOBRE
           -------------------------------------------------------------------------- */
        function burstParticles(amount = 14) {
            const emojis = ["💖", "✨", "🌸", "💫", "🦋", "🌷", "💝"];
            for (let i = 0; i < amount; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.className = 'floating-emoji';
                    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    el.style.left = (Math.random() * 90 + 5) + 'vw';
                    el.style.bottom = '-35px';
                    el.style.fontSize = (Math.random() * 16 + 15) + 'px';
                    const duration = (Math.random() * 2.5 + 3.2).toFixed(2);
                    el.style.animationDuration = `${duration}s`;
                    document.body.appendChild(el);

                    setTimeout(() => el.remove(), duration * 1000);
                }, i * 75);
            }
        }

        // Parallax 3D en Desktop cuando el sobre está cerrado
        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth > 768 && !state.isOpened) {
                const env = document.getElementById('envelopeScene');
                const xAxis = (window.innerWidth / 2 - e.clientX) / 26;
                const yAxis = (window.innerHeight / 2 - e.clientY) / 26;
                env.style.transform = `rotateY(${xAxis}deg) rotateX(${-yAxis}deg)`;
            }
        });

        /* --------------------------------------------------------------------------
           5. MODAL PERSONALIZADOR DE URL
           -------------------------------------------------------------------------- */
        function openCustomizer() {
            document.getElementById('customTitleInput').value = state.title;
            document.getElementById('customMsgInput').value = state.message;
            document.getElementById('customPdInput').value = state.pd;
            document.getElementById('customizerModal').classList.add('open');
        }

        function closeCustomizer() {
            document.getElementById('customizerModal').classList.remove('open');
        }

        function copyShareableUrl() {
            const newTitle = document.getElementById('customTitleInput').value.trim() || DEFAULT_TITLE;
            const newMsg = document.getElementById('customMsgInput').value.trim() || DEFAULT_MSG;
            const newPd = document.getElementById('customPdInput').value.trim() || DEFAULT_PD;

            const query = new URLSearchParams({
                title: newTitle,
                msg: newMsg,
                pd: newPd,
                theme: state.theme
            });

            const shareUrl = `${window.location.origin}${window.location.pathname}?${query.toString()}`;

            navigator.clipboard.writeText(shareUrl).then(() => {
                showToast("¡Enlace copiado! Listo para enviar");
                closeCustomizer();
                setTimeout(() => {
                    window.location.search = query.toString();
                }, 900);
            }).catch(() => {
                window.location.search = query.toString();
            });
        }

        function showToast(text) {
            const toast = document.getElementById('toastMsg');
            toast.textContent = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3200);
        }

        /* --------------------------------------------------------------------------
           6. CANVAS DE FONDO: LUCIÉRNAGAS Y ESTRELLAS FUGACES + RASTRO MÁGICO
           -------------------------------------------------------------------------- */
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        const trailCanvas = document.getElementById('trailCanvas');
        const trailCtx = trailCanvas.getContext('2d');

        let width, height;
        const stars = [];
        const shootingStars = [];
        const sparkles = [];

        function resizeCanvases() {
            width = window.innerWidth;
            height = window.innerHeight;
            bgCanvas.width = width;
            bgCanvas.height = height;
            trailCanvas.width = width;
            trailCanvas.height = height;
        }

        window.addEventListener('resize', resizeCanvases);
        resizeCanvases();

        // Inicializar luciérnagas / estrellas
        for (let i = 0; i < 55; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 1.9 + 0.5,
                vx: (Math.random() - 0.5) * 0.3,
                vy: (Math.random() - 0.5) * 0.3,
                alpha: Math.random(),
                delta: (Math.random() * 0.015) + 0.004
            });
        }

        function spawnShootingStar() {
            if (Math.random() < 0.012 && shootingStars.length < 2) {
                shootingStars.push({
                    x: Math.random() * width * 0.8,
                    y: Math.random() * height * 0.35,
                    len: Math.random() * 75 + 45,
                    speed: Math.random() * 8 + 7,
                    alpha: 1
                });
            }
        }

        // Rastro de polvo de hadas al mover mouse o tocar pantalla
        function addSparkle(x, y) {
            for (let i = 0; i < 2; i++) {
                sparkles.push({
                    x: x + (Math.random() - 0.5) * 12,
                    y: y + (Math.random() - 0.5) * 12,
                    vx: (Math.random() - 0.5) * 1.2,
                    vy: (Math.random() - 0.5) * 1.2 + 0.4,
                    size: Math.random() * 2.8 + 1,
                    alpha: 1,
                    color: Math.random() > 0.5 ? '#ffd166' : '#ff8fa3'
                });
            }
        }

        window.addEventListener('mousemove', (e) => addSparkle(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => {
            if (e.touches[0]) addSparkle(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });

        function renderLoop() {
            bgCtx.clearRect(0, 0, width, height);
            trailCtx.clearRect(0, 0, width, height);

            // Dibujar luciérnagas
            stars.forEach(s => {
                s.x += s.vx;
                s.y += s.vy;
                s.alpha += s.delta;
                if (s.alpha > 1 || s.alpha < 0.15) s.delta = -s.delta;

                if (s.x < 0) s.x = width;
                if (s.x > width) s.x = 0;
                if (s.y < 0) s.y = height;
                if (s.y > height) s.y = 0;

                bgCtx.beginPath();
                bgCtx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                bgCtx.fillStyle = `rgba(255, 215, 230, ${s.alpha})`;
                bgCtx.fill();
            });

            // Dibujar estrellas fugaces
            spawnShootingStar();
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const st = shootingStars[i];
                st.x += st.speed;
                st.y += st.speed * 0.55;
                st.alpha -= 0.022;

                const grad = bgCtx.createLinearGradient(st.x, st.y, st.x - st.len, st.y - st.len * 0.55);
                grad.addColorStop(0, `rgba(255, 255, 255, ${st.alpha})`);
                grad.addColorStop(1, 'rgba(255, 255, 255, 0)');

                bgCtx.strokeStyle = grad;
                bgCtx.lineWidth = 1.8;
                bgCtx.beginPath();
                bgCtx.moveTo(st.x, st.y);
                bgCtx.lineTo(st.x - st.len, st.y - st.len * 0.55);
                bgCtx.stroke();

                if (st.alpha <= 0) shootingStars.splice(i, 1);
            }

            // Dibujar rastro de chispas
            for (let i = sparkles.length - 1; i >= 0; i--) {
                const sp = sparkles[i];
                sp.x += sp.vx;
                sp.y += sp.vy;
                sp.alpha -= 0.032;

                trailCtx.save();
                trailCtx.globalAlpha = Math.max(0, sp.alpha);
                trailCtx.fillStyle = sp.color;
                trailCtx.beginPath();
                trailCtx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
                trailCtx.fill();
                trailCtx.restore();

                if (sp.alpha <= 0) sparkles.splice(i, 1);
            }

            requestAnimationFrame(renderLoop);
        }

        renderLoop();
    </script>
</body>
